name: Publish solution into the production environment

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main


jobs:
  deploy_ftp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      # .htaccess routes SPA URLs (/projekty, /kontakt, ...) to index.html - without it they return 404.
      - name: Check .htaccess is in the build
        run: test -f dist/.htaccess

      # Uploads the contents of dist/. The "*" glob skips dotfiles, so .htaccess goes in the next step.
      - name: SFTP Deploy (site)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_NAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          local_path: './dist/*'
          remote_path: 'web/'
          sftp_only: true

      - name: SFTP Deploy (.htaccess)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_NAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          local_path: './dist/.htaccess'
          remote_path: 'web/'
          sftp_only: true
