name: Publish solution into the production environment

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main


jobs:
  deploy_ftp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      # .htaccess routes SPA URLs (/projekty, /kontakt, ...) to index.html - without it they return 404.
      - name: Check .htaccess is in the build
        run: test -f dist/.htaccess

      # Fail with a clear message instead of a cryptic "usage: ssh ..." when a secret is missing.
      - name: Check deploy secrets
        env:
          HOST: ${{ secrets.FTP_SERVER }}
          USER: ${{ secrets.FTP_USERNAME }}
          PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=0
          [ -n "$HOST" ] || { echo "::error::Secret FTP_SERVER is empty or missing"; missing=1; }
          [ -n "$USER" ] || { echo "::error::Secret FTP_USERNAME is empty or missing"; missing=1; }
          [ -n "$PASS" ] || { echo "::error::Secret FTP_PASSWORD is empty or missing"; missing=1; }
          case "$HOST" in *://*) echo "::error::FTP_SERVER must be a bare hostname (no ftp:// or sftp://)"; missing=1;; esac
          exit $missing

      # Uploads the contents of dist/. The "*" glob skips dotfiles, so .htaccess goes in the next step.
      - name: SFTP Deploy (site)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          local_path: './dist/*'
          remote_path: 'web/'
          sftp_only: true

      - name: SFTP Deploy (.htaccess)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          local_path: './dist/.htaccess'
          remote_path: 'web/'
          sftp_only: true
